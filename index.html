<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facebook Reels Link Converter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#0b1224,#1b3264);font-family:system-ui,'Segoe UI',sans-serif;color:white;padding:20px}.panel{width:min(100%,560px);background:#ffffff12;border:1px solid #ffffff30;border-radius:22px;padding:30px;box-shadow:0 25px 70px #0005}h1{font-size:clamp(24px,5vw,32px);margin:0 0 10px}p{color:#cbd5e1;line-height:1.6}input{width:100%;padding:16px;border:1px solid #8294b7;border-radius:12px;font-size:16px;margin:12px 0;background:white;color:#111}button{border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;background:#62a7ff;color:#071a3c}button:disabled{opacity:.6;cursor:wait}.buttons{display:flex;gap:10px;flex-wrap:wrap}.result{margin-top:18px;padding:15px;background:#ffffff15;border-radius:12px;overflow-wrap:anywhere}.result a{color:#a8d2ff}small{color:#bdc9df}.error{color:#ffb9b9}</style></head><body><main class="panel"><h1>🎬 Facebook Reels Converter</h1><p>แปลงลิงก์ Facebook Reels ให้เป็นรูปแบบมาตรฐาน พร้อมคัดลอกไปแชร์</p><form id="form"><label for="url">ลิงก์ Reel</label><input id="url" type="url" required placeholder="https://www.facebook.com/share/r/..." autocomplete="off"><button id="submit">แปลงลิงก์</button></form><div id="output" role="status" aria-live="polite"></div><p><small>ลิงก์แชร์บางรายการอาจแปลงไม่ได้หาก Facebook จำกัดการเข้าถึง การแปลง URL ไม่เปลี่ยนสิทธิ์การรับชม</small></p></main><script>const form=document.getElementById('form'),out=document.getElementById('output'),submit=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();out.textContent='กำลังตรวจสอบลิงก์...';submit.disabled=true;try{const response=await fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'ไม่สามารถแปลงได้');out.replaceChildren();const div=document.createElement('div');div.className='result';const a=document.createElement('a');a.href=data.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=data.url;const btn=document.createElement('button');btn.textContent='คัดลอกลิงก์';btn.style.marginTop='12px';btn.onclick=async()=>{await navigator.clipboard.writeText(data.url);btn.textContent='คัดลอกแล้ว ✓'};div.append(a,document.createElement('br'),btn);out.append(div)}catch(err){out.textContent=err.message;out.className='error'}finally{submit.disabled=false}});</script></body></html>
